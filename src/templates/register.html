<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register | Phishing Detection</title>
    <style>
    body {
        font-family: "Segoe UI", Arial, sans-serif;
        background: linear-gradient(135deg, #11998e, #38ef7d);
        height: 100vh;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .card {
        background: white;
        width: 420px;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 15px 40px rgba(0,0,0,0.3);
    }

    h2 {
        text-align: center;
        margin-bottom: 20px;
        color: #333;
    }

    label {
        font-size: 14px;
        margin-top: 12px;
        display: block;
        color: #444;
    }

    /* ✅ SAME STYLE AS LOGIN */
    .input-box {
        width: 100%;
        padding: 14px;
        margin-top: 6px;
        border-radius: 6px;
        border: 1px solid #ccc;
        font-size: 15px;
        box-sizing: border-box;
        transition: all 0.3s ease;
    }

    .input-box:focus {
        outline: none;
        border-color: #11998e;
        box-shadow: 0 0 0 2px rgba(17,153,142,0.2);
    }

    button {
        width: 100%;
        padding: 12px;
        margin-top: 22px;
        border: none;
        border-radius: 6px;
        background: #11998e;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }

    button:hover {
        background: #0c7c73;
    }

    .msg-error {
        color: red;
        text-align: center;
        font-weight: bold;
        margin-bottom: 10px;
    }

    .msg-success {
        color: green;
        text-align: center;
        font-weight: bold;
        margin-bottom: 10px;
    }

    .link {
        text-align: center;
        margin-top: 15px;
    }

    .link a {
        color: #11998e;
        text-decoration: none;
        font-weight: bold;
    }
</style>

</head>

<body>

<div class="card">
    <h2>Register</h2>

    {% if error %}
    <p class="msg-error">{{ error }}</p>
    {% endif %}

    {% if success %}
    <p class="msg-success">{{ success }}</p>
    {% endif %}

    <form method="POST">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" class="input-box" placeholder="Enter your email" required>

        <input type="password" id="password" name="password" class="input-box" placeholder="Enter login password" required>

        <input type="password" id="app_password" name="app_password" class="input-box" placeholder="Enter Gmail App Password" required>

        <button type="submit">Register</button>
    </form>

    <div class="link">
        Already registered? <a href="/login">Login</a>
    </div>
</div>

</body>
</html>
